<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Share</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        a { color: #007bff; text-decoration: none; word-break: break-all; margin-right: 10px; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Document Share</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>

        <h3>Uploaded Files:</h3>
        <ul id="fileList"></ul>
    </div>

    <script>
        async function loadFiles() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const ul = document.getElementById('fileList');
            ul.innerHTML = files.map(f => `
                <li>
                    <a href="/uploads/${f}" target="_blank">${f}</a>
                    <button class="del-btn" onclick="deleteFile('${f}')">Delete</button>
                </li>
            `).join('');
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            const status = document.getElementById('status');
            if (!input.files[0]) return alert('Pehle file select karein');

            status.innerText = 'Uploading...';
            const formData = new FormData();
            formData.append('document', input.files[0]);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                status.innerText = 'Upload Successful!';
                input.value = '';
                loadFiles();
            } else {
                status.innerText = 'Upload failed: ' + (data.error || 'Unknown error');
            }
        }

        async function deleteFile(filename) {
            if (!confirm('Kya aap is file ko delete karna chahte hain?')) return;
            
            const res = await fetch(`/api/files/${filename}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                loadFiles();
            } else {
                alert('Delete karne me dikkat aayi');
            }
        }

        loadFiles();
    </script>
</body>
</html>
