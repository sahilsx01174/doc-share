<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Share</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 8px 0; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Document Share</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>

        <h3>Uploaded Files:</h3>
        <ul id="fileList"></ul>
    </div>

    <script>
        async function loadFiles() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const ul = document.getElementById('fileList');
            ul.innerHTML = files.map(f => `<li><a href="/uploads/${f}" target="_blank">${f}</a></li>`).join('');
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            const status = document.getElementById('status');
            if (!input.files[0]) return alert('Pehle file select karein');

            status.innerText = 'Uploading...';
            const formData = new FormData();
            formData.append('document', input.files[0]);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                status.innerText = 'Upload Successful!';
                input.value = '';
                loadFiles();
            } else {
                status.innerText = 'Upload failed: ' + (data.error || 'Unknown error');
            }
        }

        loadFiles();
    </script>
</body>
</html>
