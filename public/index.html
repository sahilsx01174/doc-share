<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Doc Vault</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f6f8; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; margin-top: 5px; }
        .del-btn { background: #ff4d4d; }
        .hidden { display: none; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Private Document share </h2>

        <!-- Auth Forms -->
        <div id="authSection">
            <h3 id="formTitle">Sign In</h3>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <br>
            <button id="authBtn" onclick="handleAuth()">Login</button>
            <p id="toggleMsg">Account nahi hai? <a href="#" onclick="toggleAuthMode()">Sign Up karein</a></p>
            <p id="authError" style="color:red;"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="appSection" class="hidden">
            <p>Welcome, <b id="userDisplay"></b>! <button onclick="logout()" style="float:right; background:#6c757d;">Logout</button></p>
            <hr>
            <h4>Upload New Document:</h4>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Upload</button>
            <p id="status"></p>

            <h4>Your Uploaded Files:</h4>
            <ul id="fileList"></ul>
        </div>
    </div>

    <script>
        let isSignUp = false;
        let token = localStorage.getItem('userToken') || '';
        let currentUser = localStorage.getItem('userName') || '';

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? 'Create Account' : 'Sign In';
            document.getElementById('authBtn').innerText = isSignUp ? 'Sign Up' : 'Login';
            document.getElementById('toggleMsg').innerHTML = isSignUp 
                ? 'Allready Account Click ? <a href="#" onclick="toggleAuthMode()">Login</a>' 
                : 'signup? <a href="#" onclick="toggleAuthMode()">Sign Up</a>';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isSignUp ? '/api/signup' : '/api/login';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                if (isSignUp) {
                    alert('Signup Successful!.');
                    toggleAuthMode();
                } else {
                    token = data.token;
                    currentUser = data.username;
                    localStorage.setItem('userToken', token);
                    localStorage.setItem('userName', currentUser);
                    showDashboard();
                }
            } else {
                document.getElementById('authError').innerText = data.error || 'Authentication error';
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = currentUser;
            loadFiles();
        }

        async function loadFiles() {
            const res = await fetch('/api/files', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return logout();

            const files = await res.json();
            const ul = document.getElementById('fileList');
            ul.innerHTML = files.map(f => `
                <li>
                    <span>${f.originalName}</span>
                    <div>
                        <button onclick="downloadFile('${f._id}')">Download</button>
                        <button class="del-btn" onclick="deleteFile('${f._id}')">Delete</button>
                    </div>
                </li>
            `).join('');
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            if (!input.files[0]) return alert('Select a file');

            const formData = new FormData();
            formData.append('document', input.files[0]);

            const res = await fetch('/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (res.ok) {
                input.value = '';
                loadFiles();
            } else {
                alert('Upload failed');
            }
        }

        async function downloadFile(id) {
            window.open(`/api/download/${id}?token=${token}`, '_blank');
        }

        async function deleteFile(id) {
            if (!confirm('Delete this file?')) return;
            const res = await fetch(`/api/files/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadFiles();
        }

        if (token) showDashboard();
    </script>
</body>
</html>
